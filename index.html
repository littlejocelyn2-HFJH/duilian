<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="對聯闖關：八道關卡練習字數、詞性、平仄、入聲字、場合，最後用課本對聯玩抽年獸對戰。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js?v=1"></script>
<title>對聯闖關</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one narrow column; levels are red 斗方 tiles, couplets render as vertical strips like real 春聯 */
:root{
  /* Poster skin: red-and-white sunburst, heavy gothic headlines, 楷書 only on the couplets */
  --bg:#ffffff; --paper:#ffffff; --ink:#161112; --muted:#6a5b5b; --line:#f0d3d0; --blush:#fff0ee;
  --zhu:#e3241b; --gold:#e8a000;
  --ok:#1f7a45; --okbg:#e3f3e8; --bad:#e3241b; --badbg:#ffe6e3;
  --chun:#c8231b; --chun-ink:#f8d878; --chun-edge:#8f1a13; --ghost:#1f3d36; --ghost-edge:#0f211d;
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti","DFKai-SB","BiauKai",serif;
  --heavy:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.3}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(2.2rem,8vw,3.2rem);letter-spacing:.08em}
.top h1 span{color:var(--zhu)}
.sub{color:var(--muted);margin:2px 0 0}
.total{font-family:var(--display);font-size:1.15rem;color:var(--gold);white-space:nowrap}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.9rem}

/* level list */
.levels{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.lv{width:100%;display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:16px;text-align:left;
  background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.lv:hover:not(:disabled){border-color:var(--zhu)}
.lv:disabled{cursor:not-allowed;opacity:.55}
.doufang{width:46px;height:46px;margin:9px;transform:rotate(45deg);background:var(--chun);border:2px solid var(--chun-edge);
  display:grid;place-items:center;box-shadow:inset 0 0 0 3px var(--chun),inset 0 0 0 4px var(--chun-ink)}
.doufang b{transform:rotate(-45deg);font-family:var(--display);color:var(--chun-ink);font-size:1.45rem;line-height:1}
.lv.locked .doufang{background:var(--line);border-color:var(--line);box-shadow:none}
.lv.locked .doufang b{color:var(--muted)}
.lv h3{font-size:1.25rem}
.lv p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.5}
.stars{font-size:1.1rem;letter-spacing:2px;color:var(--line);white-space:nowrap}
.stars .on{color:var(--gold)}

/* game panel */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.92rem}
.meter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem}
.track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--zhu);transition:width .3s}
.lvtitle{font-size:1.7rem}
.hint{background:var(--paper);border-left:4px solid var(--gold);padding:10px 14px;margin:0;color:var(--muted);font-size:.95rem;border-radius:0 6px 6px 0}
.hint b{color:var(--ink)}
.q{font-family:var(--display);font-size:clamp(1.4rem,5.5vw,1.9rem);line-height:1.5;margin:0}
.q em{font-style:normal;color:var(--zhu)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.wide{grid-template-columns:1fr}
.opt{background:var(--paper);border:2px solid var(--line);border-radius:6px;padding:12px 14px;font-family:var(--display);
  font-size:1.3rem;text-align:left;min-width:0;line-height:1.45;transition:border-color .15s,background .15s}
.opts.wide .opt{font-size:1.2rem}
.opt:hover:not(:disabled){border-color:var(--zhu)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt small{display:block;font-family:var(--body);font-size:.88rem;color:var(--muted);margin-top:4px}

/* vertical strips */
.pair{display:flex;justify-content:center;gap:clamp(20px,10vw,64px)}
.strip{writing-mode:vertical-rl;text-orientation:upright;background:var(--chun);color:var(--chun-ink);border:2px solid var(--chun-edge);
  font-family:var(--display);font-size:clamp(1.3rem,5.5vw,1.7rem);letter-spacing:.18em;padding:16px 8px;border-radius:3px;
  box-shadow:inset 0 0 0 4px var(--chun),inset 0 0 0 5px rgba(246,212,126,.5);line-height:1}
button.strip{transition:transform .15s,box-shadow .15s}
button.strip:hover:not(:disabled){transform:translateY(-3px)}
button.strip:disabled{cursor:default}
.strip.ok{outline:4px solid var(--ok);outline-offset:4px}
.strip.bad{outline:4px dashed var(--bad);outline-offset:4px}
.tag{writing-mode:horizontal-tb;display:block;margin:0 auto;font-family:var(--body);font-size:.8rem;letter-spacing:0;color:var(--muted);text-align:center}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}

.fb{border-radius:6px;padding:12px 16px;margin:0;font-size:1rem}
.fb.ok{background:var(--okbg);color:var(--ink);border:1px solid var(--ok)}
.fb.bad{background:var(--badbg);color:var(--ink);border:1px solid var(--bad)}
.fb strong{color:var(--ok)} .fb.bad strong{color:var(--bad)}
.next{align-self:flex-end;background:var(--zhu);color:#fff;border:0;border-radius:999px;padding:10px 26px;font-weight:700;font-size:1rem}
.next:disabled{opacity:.4;cursor:not-allowed}

/* door */
.door{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto 1fr;gap:10px 12px;align-items:stretch;
  max-width:440px;width:100%;margin:0 auto}
.slot{border:2px dashed var(--line);border-radius:4px;background:var(--paper);display:grid;place-items:center;color:var(--muted);
  font-size:.85rem;padding:0}
.slot.v{width:clamp(48px,13vw,60px);min-height:250px;grid-row:2}
.slot.h{grid-column:2;grid-row:1;min-height:52px}
.slot.sel{border-color:var(--zhu);border-style:solid}
.slot .strip{width:100%;height:100%;min-height:inherit;display:flex;align-items:center;justify-content:center;padding:12px 4px}
.slot.h .strip{writing-mode:horizontal-tb;padding:8px;font-size:1.3rem;letter-spacing:.3em}
.leaf{grid-column:2;grid-row:2;display:grid;grid-template-columns:1fr 1fr;gap:4px;min-height:250px}
.leaf div{background:color-mix(in srgb,var(--chun-edge) 70%,var(--ink));border-radius:3px;position:relative}
.leaf div::after{content:"";position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--chun-ink)}
.leaf div:first-child::after{right:8px} .leaf div:last-child::after{left:8px}
.side{grid-row:1;align-self:end;text-align:center;font-size:.78rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:56px}
.chip{background:var(--chun);color:var(--chun-ink);border:2px solid var(--chun-edge);border-radius:3px;font-family:var(--display);
  font-size:1.2rem;letter-spacing:.12em;padding:8px 14px}
.chip.sel{outline:3px solid var(--gold);outline-offset:3px}
.you{text-align:center;color:var(--muted);font-size:.85rem;margin:0}

.result{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.result .stars{font-size:2.4rem}
.result h2{font-size:2rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:10px 22px}

/* level 6: card battle */
.setup{display:flex;flex-direction:column;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px}
.field{display:flex;flex-direction:column;gap:6px;font-size:.92rem;color:var(--muted)}
.field select,.field input{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink)}
.seg label:has(input:checked){border-color:var(--zhu);color:var(--zhu);font-weight:700}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setup .next{align-self:flex-start}
.zone{display:flex;flex-direction:column;gap:8px}
.zhead{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.zhead b{color:var(--ink);font-family:var(--display);font-size:1.2rem}
.backs{display:flex;flex-wrap:wrap;gap:6px;min-height:62px}
.cback{width:36px;height:58px;padding:0;border-radius:4px;border:2px solid var(--chun-edge);
  background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(246,212,126,.28) 6px 7px),var(--chun);
  box-shadow:inset 0 0 0 3px var(--chun),inset 0 0 0 4px var(--chun-ink);transition:transform .15s}
.cback:hover:not(:disabled){transform:translateY(-5px)}
.cback:disabled{cursor:default;opacity:.8}
.felt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:end;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px}
.hand-slot{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);white-space:nowrap}
.hand-slot b{color:var(--zhu);font-size:.95rem}
.hslot{width:56px;height:224px;border:2px dashed var(--line);border-radius:4px;background:var(--bg);padding:0;display:grid;place-items:center;color:var(--muted);font-size:.8rem;writing-mode:vertical-rl}
.hslot.ready{border-color:var(--zhu);border-style:solid;color:var(--zhu)}
.hslot .card{width:100%;height:100%}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-width:0;align-self:center}
.mid .next{align-self:center}
.hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:12px}
.card{writing-mode:vertical-rl;text-orientation:upright;width:48px;height:224px;padding:10px 0;border-radius:4px;background:var(--chun);color:var(--chun-ink);
  border:2px solid var(--chun-edge);box-shadow:inset 0 0 0 3px var(--chun),inset 0 0 0 4px rgba(246,212,126,.55);
  font-family:var(--display);font-size:var(--fs,22px);line-height:1;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;transition:transform .15s;position:relative}
button.card:hover{transform:translateY(-4px)}
.card.sel,button.card.sel:hover{transform:translateY(-12px);outline:3px solid var(--gold);outline-offset:3px}
.card.new::before{content:"新";writing-mode:horizontal-tb;position:absolute;top:-10px;right:-8px;background:var(--gold);color:var(--paper);font-family:var(--body);font-size:.72rem;border-radius:999px;padding:1px 6px;letter-spacing:0;line-height:1.5}
.card.nian{background:var(--ghost);border-color:var(--ghost-edge);box-shadow:inset 0 0 0 3px var(--ghost),inset 0 0 0 4px rgba(246,212,126,.55);letter-spacing:.4em}
.mini{display:flex;gap:6px;justify-content:center}
.mini .card{width:30px;height:auto;padding:6px 0;font-size:15px;letter-spacing:0}
.played{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--muted)}
.fb.info{background:var(--paper);border:1px solid var(--line)}
.fb.info strong{color:var(--ink)}
.review{display:flex;flex-direction:column;gap:2px;width:100%;max-width:560px;text-align:left}
.rv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 16px;border-top:1px solid var(--line);padding-block:6px;font-family:var(--display);font-size:1.05rem;line-height:1.45}
.rv.h{font-family:var(--body);font-size:.8rem;color:var(--muted);border:0}
.rv i{grid-column:1/-1;font-style:normal;font-family:var(--body);font-size:.78rem;color:var(--gold)}
@media (max-width:440px){.card{width:42px;height:210px}.hslot{width:48px;height:210px}.felt{gap:8px;padding:10px}.hand{gap:6px}}
.signs .opt{text-align:center;letter-spacing:.12em;border-style:double;border-width:4px}
@media (max-width:440px){.opts{grid-template-columns:1fr}.lv{grid-template-columns:52px 1fr;gap:12px}.lv .stars{grid-column:2}.doufang{width:38px;height:38px;margin:7px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== poster skin ===== */
body{background:repeating-conic-gradient(from -4deg at 50% -20%,#fff 0 4deg,var(--blush) 4deg 8deg) fixed,#fff}
h1,h2,h3{font-family:var(--heavy);font-weight:900;letter-spacing:.02em}
.top{position:relative;overflow:hidden;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:10px;min-height:210px;
  padding:56px 20px 22px;background:repeating-conic-gradient(from 0deg at 88% 115%,var(--zhu) 0 6deg,#fff 6deg 12deg)}
.top h1{background:var(--zhu);color:#fff;padding:4px 18px 8px;transform:skew(-8deg);font-size:clamp(2.4rem,11vw,3.8rem);letter-spacing:.06em;box-shadow:6px 6px 0 var(--ink);line-height:1.15}
.top h1 span{color:#fff}
.top .sub{background:var(--ink);color:#fff;padding:3px 12px;transform:skew(-8deg);font-weight:700;font-size:.92rem;margin:0}
.top .total{position:absolute;top:14px;right:14px;background:#fff;color:var(--zhu);font-family:var(--heavy);font-weight:900;padding:2px 12px;border:3px solid var(--zhu);transform:rotate(5deg);font-size:1.1rem}
.tagline{position:absolute;top:16px;left:-6px;background:#fff;color:var(--zhu);font-weight:900;font-size:1rem;padding:2px 16px 2px 18px;transform:rotate(-4deg);box-shadow:3px 3px 0 var(--zhu);margin:0}
.lv{border:0;border-left:8px solid var(--zhu);border-radius:0;box-shadow:0 0 0 2px var(--line);transition:transform .15s}
.lv:hover:not(:disabled){transform:translateX(4px)}
.lv h3{font-size:1.2rem}
.lvtitle{align-self:flex-start;background:var(--zhu);color:#fff;padding:2px 16px 6px;transform:skew(-8deg);margin-left:6px;font-size:1.6rem;box-shadow:4px 4px 0 var(--ink)}
.hint{border-left-color:var(--zhu);border-radius:0;box-shadow:0 0 0 1px var(--line)}
.next{font-weight:900;transform:skew(-8deg);border-radius:2px;box-shadow:4px 4px 0 var(--ink);padding:10px 28px}
.next:hover:not(:disabled){background:#c41810}
.back,.ghost{border:2px solid var(--ink);font-weight:700;background:#fff}
.result{border:3px solid var(--ink);border-radius:0;box-shadow:8px 8px 0 var(--zhu)}
.result h2{color:var(--zhu)}
.opt{border-radius:2px}
.setup{border:3px solid var(--ink);border-radius:0;box-shadow:6px 6px 0 var(--zhu)}
.setup h3{font-size:1.3rem}
.felt{border-radius:0}
.cta{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;border:0;background:var(--ink);color:#fff;
  padding:16px 22px;transform:skew(-4deg);box-shadow:6px 6px 0 var(--zhu);text-align:left}
.cta b{font-family:var(--heavy);font-weight:900;font-size:1.35rem}
.cta span{color:#ffd0cc;font-weight:700}
.cta:hover{transform:skew(-4deg) translateY(-2px)}
/* board */
.bigstar{font-family:var(--heavy);font-weight:900;color:var(--zhu);font-size:1.6rem}
.skills{display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);padding:10px 12px;background:#fff;color:var(--ink);cursor:pointer;line-height:1.5}
.chk input{margin-top:4px;accent-color:var(--zhu);width:18px;height:18px;flex:none}
.chk:has(input:checked){border-color:var(--zhu);background:var(--blush)}
.field textarea{font:inherit;font-size:1rem;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;resize:vertical}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.r{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:2px 12px;align-items:center;background:#fff;border:2px solid var(--ink);padding:10px 14px}
.r .no{font-family:var(--heavy);font-weight:900;font-style:italic;font-size:2rem;color:var(--zhu);line-height:1;grid-row:span 2;text-align:center}
.r .nm{font-weight:900;font-size:1.1rem;min-width:0;overflow-wrap:anywhere}
.r .sc{font-family:var(--heavy);font-weight:900;font-size:1.15rem;white-space:nowrap;color:var(--zhu);display:flex;align-items:center;gap:8px}
.r .say{grid-column:2/-1;font-family:var(--display);font-size:1.08rem;overflow-wrap:anywhere}
.r .sk{grid-column:2/-1;font-size:.8rem;color:var(--muted)}
.r.top3{background:var(--zhu);border-color:var(--zhu);color:#fff;box-shadow:4px 4px 0 var(--ink)}
.r.top3 .no,.r.top3 .sc,.r.top3 .sk{color:#fff}
.r .del{background:none;border:1px solid currentColor;border-radius:999px;padding:0 8px;font-size:.8rem;font-family:var(--body);font-weight:400;color:inherit}
.r .loc{font-size:.72rem;font-weight:700;border:1px solid currentColor;padding:0 6px;border-radius:999px;margin-left:6px}
.empty{background:#fff;border:2px dashed var(--line);padding:20px;text-align:center;color:var(--muted);margin:0}
.bmode{font-size:.85rem;color:var(--muted)}
@media (max-width:440px){.top{min-height:190px}.r{grid-template-columns:40px minmax(0,1fr) auto}.r .no{font-size:1.6rem}}

[hidden]{display:none!important}
/* class edition */
.whobar{display:flex;justify-content:space-between;align-items:center;gap:8px 14px;flex-wrap:wrap;background:#fff;border:2px solid var(--ink);padding:8px 14px;font-size:.95rem}
.overlay{position:fixed;inset:0;background:rgba(22,17,18,.6);display:grid;place-items:center;z-index:50;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.reg{max-width:460px;width:100%;background:#fff}
.reg h2{font-size:1.6rem;color:var(--zhu)}
.sync-ok{color:var(--ok)!important;font-weight:700}.sync-bad{color:var(--bad)!important;font-weight:700}
.codebox{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px}
.codebox textarea,.tsec textarea{font:inherit;font-size:.85rem;width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff;color:var(--ink);word-break:break-all}
.field.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:700}
.tbl{overflow-x:auto;width:100%}
.tbl table{border-collapse:collapse;width:100%;background:#fff;font-size:.92rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap;vertical-align:top}
.tbl th{background:var(--ink);color:#fff;font-weight:700;position:sticky;top:0}
.tbl td.ans,.tbl td.say2{white-space:normal;min-width:16em}
.tbl td.say2{font-family:var(--display);font-size:1.05rem}
table.lb{border:2px solid var(--ink);font-size:1.02rem}
table.lb td.no{font-family:var(--heavy);font-weight:900;font-style:italic;color:var(--zhu);font-size:1.3rem}
table.lb td.st{font-weight:900;color:var(--zhu)}
table.lb tr.top3 td{background:var(--zhu);color:#fff}
table.lb tr.top3 td.no,table.lb tr.top3 td.st{color:#fff}
tr.sus td{background:#fff4d6}
.flag{background:#e8a000;color:#fff;font-weight:700;border-radius:999px;padding:0 8px;font-size:.8rem}

 {q:"哪一句是<em>上聯</em>？",o:["竹報平安福","花開富貴春"],why:"「福」是入聲（仄），所以是上聯；「春」是平聲，是下聯。課本的春聯範例。"},
 {q:"哪一句是<em>上聯</em>？",o:["常體天地好生德","獨存聖賢濟世方"],why:"「德」是入聲（仄），所以是上聯；「方」是平聲。課本的醫院行業聯。"},
 {q:"哪一句是<em>上聯</em>？",o:["旭日隨心臨吉宅","春風著意入新居"],why:"「宅」是入聲（仄），所以是上聯；「居」是平聲。課本的新居賀聯。"}
 ]},
{name:"找出下聯",draw:6,desc:"字數、詞性、平仄全部到位",type:"choice",wide:true,
 hint:"好的下聯要同時做到三件事：<b>字數相等、詞性相對、末字是平聲</b>。選錯了會告訴你錯在哪一點。",
 qs:[
 {q:"下列哪一副<em>合乎對聯的作法</em>？",o:[
   {t:"山河增秀色／大地播春暉",ok:1,why:"山河↔大地、增↔播、秀色↔春暉，上聯「色」仄聲、下聯「暉」平聲。（應用練習題）"},
   {t:"芝蘭飄香萬里聞／松柏長留天地春",why:"上聯末字「聞」是平聲，上聯應該仄聲收尾。"},
   {t:"春來花開添富貴／萬象回春家有慶",why:"下聯末字「慶」是仄聲，而且「春」字上下重複。"},
   {t:"飽讀詩書涵養情性／公而忘私國而忘家",why:"平仄沒錯，但「飽讀詩書」和「公而忘私」結構不同，對仗不工整。"}]},
 {q:"上聯：<em>春回大地千山秀</em>",o:[
   {t:"日照神州萬木榮",ok:1,why:"春回↔日照、大地↔神州、千山↔萬木、秀↔榮，字字相對，「榮」是平聲。"},
   {t:"福到人間萬事好",why:"末字「好」是三聲（仄聲），下聯應該用平聲收尾。"},
   {t:"大家一起過新年",why:"字數對了，但「大家」對不上「春回」，詞性沒有相對。"},
   {t:"日照神州萬木欣欣向榮",why:"上聯 7 個字，這句 10 個字，字數不相等。"}]},
 {q:"上聯：<em>天增歲月人增壽</em>",o:[
   {t:"春滿乾坤福滿門",ok:1,why:"天↔春、增↔滿、歲月↔乾坤、人↔福、壽↔門，而且「增」重複的位置，下聯的「滿」也在同樣位置重複。"},
   {t:"春滿乾坤福滿戶",why:"「戶」是四聲（仄聲），下聯末字要平聲。"},
   {t:"新年快樂又平安",why:"末字是平聲，但「新年快樂」和「天增歲月」的結構對不起來。"},
   {t:"春滿乾坤福滿家門",why:"上聯 7 個字，這句 8 個字。"}]},
 {q:"上聯：<em>花開富貴</em>",o:[
   {t:"竹報平安",ok:1,why:"花↔竹（植物）、開↔報（動作）、富貴↔平安，「安」是平聲。"},
   {t:"竹報吉慶",why:"「慶」是四聲（仄聲），不能放在下聯末字。"},
   {t:"平安喜樂",why:"「平安」對不上「花開」，結構不同；「樂」也是仄聲。"},
   {t:"竹報平安來",why:"多了一個字，字數不相等。"}]},
 {q:"上聯：<em>一帆風順年年好</em>",o:[
   {t:"萬事如意步步高",ok:1,why:"一帆↔萬事（數字＋名詞）、年年↔步步（疊字對疊字），「高」是平聲。"},
   {t:"萬事如意步步好",why:"「好」是仄聲，而且和上聯末字重複了。"},
   {t:"祝你考試一百分",why:"結構和詞性都對不上，「年年」這組疊字也沒有對應。"},
   {t:"萬事如意步步都高升",why:"上聯 7 個字，這句 9 個字。"}]},
 {q:"上聯：<em>綠水本無憂因風皺面</em>",o:[
   {t:"青山原不老為雪白頭",ok:1,why:"綠水↔青山、本無憂↔原不老、因風↔為雪、皺面↔白頭，「頭」是平聲。"},
   {t:"青山原不老為雪白頂",why:"「頂」是三聲（仄聲），下聯要平聲收尾。"},
   {t:"我們要快樂天天開心",why:"字數一樣，但「我們」對「綠水」，詞性完全不同。"},
   {t:"青山原不老為雪白了頭",why:"多了一個「了」，字數不相等。"}]},
 {q:"上聯：<em>一元復始</em>",o:[
   {t:"萬象更新",ok:1,why:"一元↔萬象（數字＋名詞）、復始↔更新，「新」是平聲。"},
   {t:"萬象更好",why:"「好」是三聲（仄聲），下聯末字要平聲。"},
   {t:"恭喜發財",why:"末字是平聲，但「恭喜」對不上「一元」，詞性沒有相對。"},
   {t:"萬象都更新",why:"上聯 4 個字，這句 5 個字。"}]},
 {q:"上聯：<em>風調雨順</em>",o:[
   {t:"國泰民安",ok:1,why:"風↔國、調↔泰、雨↔民、順↔安，一字對一字，「安」是平聲。"},
   {t:"國泰民樂",why:"「樂」是四聲（仄聲），不能當下聯末字。"},
   {t:"天天開心",why:"疊字「天天」對不上「風調」，結構不同。"},
   {t:"國泰民安康",why:"多了一個字，字數不相等。"}]},
 {q:"上聯：<em>五湖四海皆春色</em>",o:[
   {t:"萬水千山盡得輝",ok:1,why:"五湖四海↔萬水千山（數字＋地理）、皆↔盡、春色↔得輝，「輝」是平聲。"},
   {t:"萬水千山盡錦繡",why:"「繡」是四聲（仄聲），下聯要平聲收尾。"},
   {t:"大家一起來拜年",why:"字數相同，但「大家一起」和「五湖四海」對不起來。"},
   {t:"萬水千山盡是光輝",why:"上聯 7 個字，這句 8 個字。"}]},
 {q:"上聯：<em>迎新春事事如意</em>",o:[
   {t:"接鴻福步步高升",ok:1,why:"迎↔接、新春↔鴻福、事事↔步步（疊字對疊字）、如意↔高升，「升」是平聲。"},
   {t:"接鴻福步步登頂",why:"「頂」是三聲（仄聲），下聯末字要平聲。"},
   {t:"恭喜大家都發財",why:"結構對不上，疊字「事事」也沒有對應。"},
   {t:"接鴻福步步都高升",why:"上聯 7 個字，這句 8 個字。"}]},
 {q:"上聯：<em>綠竹別其三分景</em>",o:[
   {t:"紅梅正報萬家春",ok:1,why:"綠竹↔紅梅（顏色＋植物）、三分景↔萬家春，「春」是平聲。"},
   {t:"紅梅正報萬家喜",why:"「喜」是三聲（仄聲），下聯要平聲收尾。"},
   {t:"我家門口有梅花",why:"末字是平聲，但「我家」對不上「綠竹」。"},
   {t:"紅梅正報萬家新春",why:"上聯 7 個字，這句 8 個字。"}]},
 {q:"上聯：<em>民安國泰逢盛世</em>",o:[
   {t:"風調雨順頌華年",ok:1,why:"民安國泰↔風調雨順、逢↔頌、盛世↔華年，「年」是平聲。"},
   {t:"風調雨順頌華歲",why:"「歲」是四聲（仄聲），下聯末字要平聲。"},
   {t:"大家一起放鞭炮",why:"結構、詞性都對不上，「炮」也是仄聲。"},
   {t:"風調雨順頌美好華年",why:"上聯 7 個字，這句 9 個字。"}]}
 ]},
{name:"對聯小知識",draw:6,desc:"春聯怎麼貼、對聯有哪些名字",type:"choice",
 hint:"最後一關要動手貼春聯，先把規則弄清楚。",
 qs:[
 {q:"關於對聯的敘述，下列何者正確？",wide:true,o:["由兩個完整的句子構成，兩句的字數必須相等","講究平仄協調，有所謂「平起仄收」的規定","內容須引用典故，以發揮最大的功效","用途廣泛，但多用於慶賀，不可用於喪葬場合"],why:"對聯是「仄起平收」，不是平起仄收；內容不一定要用典故；喪葬場合也會用輓聯。（應用練習題）"},
 {q:"面向大門時，<em>上聯</em>應該貼在哪一邊？",o:["右邊","左邊","哪邊都可以","貼在門中間"],why:"古人由右往左書寫，所以面向大門，上聯在右、下聯在左。"},
 {q:"貼在門楣正中、通常四個字的叫做什麼？",o:["橫批","斗方","門神","上聯"],why:"橫批是整副對聯的總結。斗方是菱形貼的方形紙，常寫「春」「福」。"},
 {q:"上聯和下聯的字數必須怎樣？",o:["完全相等","下聯比較多","上聯比較多","沒有規定"],why:"字數相等是對聯最基本的要求。"},
 {q:"對聯也可以叫做什麼？",o:["楹聯","絕句","律詩","詞牌"],why:"對聯常掛在柱子（楹）上，所以又叫楹聯，也叫對子。"},
 {q:"「天對地，雨對風」出自哪本書？",o:["笠翁對韻","三字經","千字文","唐詩三百首"],why:"《笠翁對韻》是清代李漁（號笠翁）編的啟蒙讀物，專門練習對仗。"},
 {q:"面向大門時，<em>下聯</em>應該貼在哪一邊？",o:["左邊","右邊","門楣上","門中間"],why:"上聯在右、下聯在左，橫批貼在門楣。"},
 {q:"上聯的<em>最後一個字</em>通常是什麼聲？",o:["仄聲","平聲","輕聲","沒有規定"],why:"上聯仄聲收尾、下聯平聲收尾，唸起來才有起伏。"},
 {q:"下聯的<em>最後一個字</em>通常是什麼聲？",o:["平聲","仄聲","輕聲","沒有規定"],why:"下聯用平聲收尾，聲音比較悠長，有收束的感覺。"},
 {q:"春聯的前身是什麼？",o:["桃符","門神畫","燈籠","紅包"],why:"古人在門上掛桃木板驅邪，叫做桃符。王安石〈元日〉說「總把新桃換舊符」。"},
 {q:"相傳最早的春聯「新年納餘慶，嘉節號長春」是誰寫的？",o:["孟昶","李白","孔子","蘇軾"],why:"五代後蜀國君孟昶在桃符上寫下這兩句，常被視為最早的春聯。"},
 {q:"斗方常寫哪個字？",o:["福","山","走","月"],why:"斗方是方形紅紙斜貼成菱形，常寫「福」「春」等吉祥字。"},
 {q:"上下聯<em>相同位置</em>，一般要避免什麼？",o:["用同一個字","用不同的字","用名詞","用動詞"],why:"同一位置用同一字就失去「對」的變化。（如果上聯自己有重複字，下聯在同樣位置也重複，則是特殊對法，例如「天增歲月人增壽」。）"}
 ]},

function start(i){if(LEVELS[i].type==="cards")return cardSetup();G={i,L:LEVELS[i],qs:shuffle(LEVELS[i].qs).slice(0,LEVELS[i].draw),n:0,score:0,t0:Date.now(),ans:[]};render()}

function shell(body){
  const {L,n,qs,i,score}=G;
  app.innerHTML=`<div class="bar"><button class="back" id="bk">← 關卡列表</button>
   <span class="meter">第 ${Math.min(n+1,qs.length)} / ${qs.length} 題　答對 ${score}</span></div>
   <div class="track"><i style="width:${n/qs.length*100}%"></i></div>
   <h2 class="lvtitle">第${NUM[i]}關　${L.name}</h2>
   <p class="hint">${L.hint}</p>${body}
   <div id="fbx"></div><button class="next" id="nx" hidden>${n+1<qs.length?'下一題 →':'看結果 →'}</button>`;
  bk.onclick=home;
  nx.onclick=()=>{G.n++;G.n<qs.length?render():finish()};
}
function feedback(ok,why){
  fbx.innerHTML=`<p class="fb ${ok?'ok':'bad'}"><strong>${ok?'答對了！':'再想想'}</strong>　${why}</p>`;
  if(ok)G.score++;
  nx.hidden=false;nx.focus();
}

function render(){
  const q=G.qs[G.n],t=G.L.type;
  if(t==="choice"){
    const opts=shuffle(q.o.map((o,k)=>typeof o==="string"?{t:o,ok:k===0}:o));
    const pr=q.pair?(()=>{const f=q.pair[0].length>9?"font-size:1.1rem;":q.pair[0].length>6?"font-size:1.35rem;":"";return `<div class="pair"><div class="col"><span class="strip" style="${f}">${q.pair[1]}</span><span class="tag">下聯</span></div><div class="col"><span class="strip" style="${f}">${q.pair[0]}</span><span class="tag">上聯</span></div></div>`})():"";
    shell(`<p class="q">${q.q}</p>${pr}<div class="opts ${(G.L.wide||q.wide)?'wide':''} ${q.pair?'signs':''}">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join("")}</div>`);
    const bs=app.querySelectorAll(".opt");
    bs.forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.k];
      bs.forEach((x,k)=>{x.disabled=true;if(opts[k].ok)x.classList.add("ok")});
      if(!o.ok)b.classList.add("bad");
      logAns(q.pair?q.pair[0]+"／"+q.pair[1]:q.q,+b.dataset.k,o.t,o.ok);
      const right=opts.find(x=>x.ok);
      let why=right.why||q.why;
      if(!o.ok&&o.why)why=`「${o.t}」：${o.why}<br>正確答案「${right.t}」：${why}`;
      feedback(o.ok,why);
    });
  }else if(t==="pick"){
    const lines=shuffle([{t:q.a,up:1},{t:q.b,up:0}]);
    shell(`<p class="q">這兩句，哪一句是<em>上聯</em>？</p>
     <div class="pair">${lines.map((l,k)=>`<div class="col"><button class="strip" data-k="${k}">${l.t}</button></div>`).join("")}</div>`);
    const bs=app.querySelectorAll("button.strip");
    bs.forEach(b=>b.onclick=()=>{
      const l=lines[+b.dataset.k];
      logAns(q.a+"／"+q.b,+b.dataset.k,l.t,l.up);
      bs.forEach((x,k)=>{x.disabled=true;x.classList.add(lines[k].up?"ok":"bad");
        x.insertAdjacentHTML("afterend",`<span class="tag">${lines[k].up?'上聯（仄收）':'下聯（平收）'}</span>`)});
      feedback(!!l.up,q.why);
    });
  }else door(q);
}

    <button class="slot h" data-s="T" aria-label="門楣"></button>
    <div class="leaf"><div></div><div></div></div>
    <button class="slot v" data-s="R" style="grid-column:3" aria-label="門右邊"></button>
   </div>
   <p class="you">↑ 你站在門口，面向大門</p>
   <div class="chips" id="chips"></div>
   <button class="next" id="chk" style="align-self:center" disabled>貼好了，檢查！</button>`);
  const draw=()=>{
    const used=Object.values(place);
    chips.innerHTML=pieces.map((p,k)=>used.includes(k)?"":`<button class="chip ${sel===k?'sel':''}" data-k="${k}">${p.t}</button>`).join("");
    app.querySelectorAll(".slot").forEach(s=>{
      const k=place[s.dataset.s];
      s.innerHTML=k==null?({T:"門楣",L:"左",R:"右"})[s.dataset.s]:`<span class="strip">${pieces[k].t}</span>`;
      s.classList.toggle("sel",sel!=null&&k==null);
    });
    chips.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{sel=sel===+c.dataset.k?null:+c.dataset.k;draw()});
    chk.disabled=used.some(v=>v==null);
  };
  app.querySelectorAll(".slot").forEach(s=>s.onclick=()=>{
    if(chk.hidden)return;
    const id=s.dataset.s;
    if(place[id]!=null){place[id]=null;fbx.innerHTML=""}
    else if(sel!=null){place[id]=sel;sel=null}
    draw();
  });
  chk.onclick=()=>{
    tries++;
    const ok=Object.entries(place).every(([s,k])=>pieces[k].r===s);
    if(ok){chk.hidden=true;fbx.innerHTML="";
      logAns(q.up+"／"+q.down,null,tries===1?"一次貼對":`第 ${tries} 次貼對`,tries===1);
      if(tries===1)feedback(true,q.why);
      else{fbx.innerHTML=`<p class="fb ok"><strong>貼對了！</strong>（第 ${tries} 次才成功，這題不計分）　${q.why}</p>`;nx.hidden=false;nx.focus()}
    }else{
      const wrong=Object.entries(place).filter(([s,k])=>pieces[k].r!==s).length;
      fbx.innerHTML=`<p class="fb bad"><strong>還有 ${wrong} 張貼錯了</strong>　提示：看兩句最後一個字的聲調，仄聲收尾的是上聯，面向大門要貼在右邊。點錯的紙可以撕下來重貼。</p>`;
    }
  };
  draw();
}

function finish(){
  const {score,qs,i}=G,n=qs.length;
  const s=score===n?3:score>=n-1?2:score>=Math.ceil(n/2)?1:0;
  if(s>P.stars[i]){P.stars[i]=s;save()}
  const last=i===LEVELS.length-1;
  const msg=s===3?"滿分過關！":s>0?"過關了！":"差一點，再試一次";
  app.innerHTML=`<div class="result">
   <h2>第${NUM[i]}關　${msg}</h2>${starHTML(s)}
   <p class="sub">答對 ${score} / ${n} 題${s===0?'　至少答對一半才能解鎖下一關':''}</p>
   <p class="sub" id="sync"></p>
   <div class="row"><button class="ghost" id="again">再玩一次</button>
   ${s>0&&!last?`<button class="next" id="go">挑戰第${NUM[i+1]}關 →</button>`:''}
   <button class="ghost" id="hm">回關卡列表</button></div></div>`;
  again.onclick=()=>start(i);hm.onclick=home;
  if(window.go)go.onclick=()=>start(i+1);
  recordAndShow("L"+(i+1),{score,total:n,stars:s,dur:Math.round((Date.now()-G.t0)/1000),ans:G.ans});
}

const cardHTML=(c,cls="",tag="button")=>`<${tag} class="card ${c.ghost?"nian":""} ${cls}" ${tag==="button"?`data-card="${c.id}"`:""} style="--fs:${c.ghost?28:fsOf(c.t)}px" aria-label="${c.ghost?"年獸牌":c.t}">${c.t}</${tag}>`;
let M=null,lastCfg=null;

function cardSetup(){

function newGame(cfg){
  const pool=COUPLETS.filter(DECKS.find(d=>d.id===cfg.deck).f);
  const deck=shuffle(pool).slice(0,Math.min(cfg.cnt,pool.length));
  let id=0;const cards=[];
  deck.forEach((cp,k)=>{cards.push({id:id++,k,up:1,t:cp.u});cards.push({id:id++,k,up:0,t:cp.d})});
  cards.push({id:id++,ghost:1,t:"年獸"});
  const hands=[[],[]];shuffle(cards).forEach((c,i)=>hands[i%2].push(c));
  M={t0:Date.now(),cfg,mode:cfg.mode,names:cfg.mode==="cpu"?["你","電腦"]:cfg.names.slice(),deck,hands,turn:0,drew:false,sel:null,
     slot:{L:null,R:null},pairs:[[],[]],miss:[0,0],msg:"",msgType:"info",last:null,taken:null,newId:null,
     handoff:cfg.mode==="pvp",over:null};
  if(cfg.mode==="cpu"){M.msg="先抽牌，再看看手上有沒有湊成一副的對聯。";}
  renderGame();
}

function renderGame(){

  let last="";
  if(m.last){const cp=m.deck[m.last.k];last=`<div class="played"><div class="mini"><span class="card" style="--fs:15px">${cp.d}</span><span class="card" style="--fs:15px">${cp.u}</span></div><span>${m.names[m.last.by]}打出・${cp.c}</span></div>`}
  const slot=(s,label,hint)=>`<div class="hand-slot"><b>${label}</b><button class="hslot ${myTurn&&m.sel!=null&&m.slot[s]==null?"ready":""}" data-slot="${s}" aria-label="${label}">${m.slot[s]!=null?cardHTML(byId(m.slot[s]),"","span"):hint}</button></div>`;
  app.innerHTML=`
  <div class="bar"><button class="back" id="bk">← 換設定</button>
   <span class="meter">配對 ${m.names[0]} ${m.pairs[0].length}・${m.names[1]} ${m.pairs[1].length}　失誤 ${m.names[0]} ${m.miss[0]}・${m.names[1]} ${m.miss[1]}</span></div>
  <h2 class="lvtitle">${myTurn?`輪到 ${m.names[me]}`:`${m.names[1]}的回合`}</h2>
  <div class="zone"><div class="zhead"><span><b>${m.names[vOp]}</b>　手牌 ${m.hands[vOp].length} 張</span><span>已配對 ${m.pairs[vOp].length} 副</span></div>
   <div class="backs">${m.hands[vOp].map((c,i)=>`<button class="cback" data-draw="${i}" ${myTurn&&!m.drew?"":"disabled"} aria-label="抽第 ${i+1} 張"></button>`).join("")}</div></div>
  <p class="hint">${step}</p>
  <div class="felt">${slot("L","左手・下聯","放下聯")}
   <div class="mid">${myTurn?`<button class="next" id="play" ${m.slot.L!=null&&m.slot.R!=null?"":"disabled"}>出牌</button>`:""}${last}</div>
   ${slot("R","右手・上聯","放上聯")}</div>
  <div id="fbx">${m.msg?`<p class="fb ${m.msgType}">${m.msg}</p>`:""}</div>

   <div class="hand">${m.hands[viewer].filter(c=>!inSlot.has(c.id)).map(c=>cardHTML(c,(m.sel===c.id?"sel ":"")+(m.newId===c.id?"new":""))).join("")||`<p class="sub" style="margin:0;padding-block:24px">手牌都放到雙手上了。點左手或右手的牌，可以收回手牌。</p>`}</div></div>
  ${myTurn?`<button class="next" id="end" ${m.drew?"":"disabled"}>結束回合</button>`:""}`;

    if(byId(id).ghost){m.sel=null;m.msg="<strong>年獸不能出牌</strong>　牠沒有另一半，只能留在手牌裡，等對手把牠抽走。";m.msgType="bad";return renderGame()}
    m.sel=m.sel===id?null:id;renderGame()});
  app.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{const s=b.dataset.slot;
    if(m.slot[s]!=null)m.slot[s]=null;else if(m.sel!=null){m.slot[s]=m.sel;m.sel=null}

function drawCard(i){
  const m=M,me=m.turn,op=1-me;if(m.drew)return;
  const c=m.hands[op].splice(i,1)[0];m.hands[me].push(c);
  m.drew=true;m.newId=c.id;m.taken={by:me,card:c};
  if(c.ghost){m.msg="<strong>抽到年獸了！</strong>　年獸配不成對，只能等對手把牠抽走。";m.msgType="bad"}
  else{m.msg=`你抽到「${c.t}」，看看能不能湊成一副。`;m.msgType="info"}
  if(m.hands[op].length===0)m.over=op;
  renderGame();
}

function playPair(){
  const m=M,me=m.turn,h=m.hands[me];
  const R=h.find(c=>c.id===m.slot.R),L=h.find(c=>c.id===m.slot.L);
  m.slot={L:null,R:null};m.sel=null;
  if(!R||!L)return renderGame();
  if(R.ghost||L.ghost){m.msg="年獸沒有另一半，不能出牌。";m.msgType="bad"}
  else if(R.k!==L.k){m.miss[me]++;
    m.msg=`<strong>不是同一副</strong>　${R.t.length!==L.t.length?`字數不同（${R.t.length} 字和 ${L.t.length} 字），一定不是同一副。`:"字數一樣，但意思和詞性對不起來。"}失誤 +1。`;m.msgType="bad"}
  else if(!R.up){m.miss[me]++;const cp=m.deck[R.k];
    m.msg=`<strong>上下聯放反了</strong>　「${cp.u}」末字「${tail(cp.u)}」是仄聲，它才是上聯，要拿在右手。${rsNote(cp.u)}失誤 +1。`;m.msgType="bad"}
  else{const cp=m.deck[R.k];
    m.hands[me]=h.filter(c=>c!==R&&c!==L);m.pairs[me].push(R.k);m.last={k:R.k,by:me};
    m.msg=`<strong>配對成功！</strong>　這是${cp.c}。${rsNote(cp.u)}`;m.msgType="ok";
    if(m.hands[me].length===0)m.over=me}
  renderGame();
}

function endTurn(){
  const m=M;if(!m.drew)return;
  const prev=m.turn;m.slot={L:null,R:null};m.sel=null;m.newId=null;
  m.turn=1-prev;m.drew=false;m.hands[prev]=shuffle(m.hands[prev]);m.msg="";
  if(m.mode==="pvp"){m.handoff=true;renderGame()}else cpuTurn();
}

function cpuTurn(){
  const m=M;m.msg=`${m.names[1]}正在抽牌…`;m.msgType="info";renderGame();
  setTimeout(()=>{
    if(M!==m||m.over!=null)return;
    const c=m.hands[0].splice(Math.floor(Math.random()*m.hands[0].length),1)[0];m.hands[1].push(c);
    let txt=`${m.names[1]}從你手上抽走了「${c.t}」${c.ghost?"，年獸被帶走了！":""}`;
    if(m.hands[0].length===0){m.over=0;return renderGame()}
    const ks={};m.hands[1].forEach(x=>{if(!x.ghost)(ks[x.k]=ks[x.k]||[]).push(x)});
    let n=0;Object.values(ks).forEach(a=>{if(a.length===2){m.hands[1]=m.hands[1].filter(x=>!a.includes(x));m.pairs[1].push(a[0].k);m.last={k:a[0].k,by:1};n++}});
    txt+=n?`，並打出 ${n} 副對聯。`:"。";
    if(m.hands[1].length===0){m.over=1;return renderGame()}
    m.turn=0;m.drew=false;m.hands[1]=shuffle(m.hands[1]);m.msg=txt;m.msgType="info";renderGame();
  },1100);
}

function handoff(){
  const m=M,me=m.turn;
  const t=m.taken&&m.taken.by!==me?`<p class="fb info">${m.names[m.taken.by]}剛剛從你手上抽走了「${m.taken.card.t}」</p>`:"";
  app.innerHTML=`<div class="result"><h2>輪到 ${m.names[me]}</h2>
   <p class="sub">請把裝置交給 ${m.names[me]}，另一位不要偷看手牌喔。</p>${t}
   <button class="next" id="rdy">我是 ${m.names[me]}，準備好了</button>
   <button class="linkbtn" id="bk">換設定</button></div>`;
  rdy.onclick=()=>{m.handoff=false;renderGame()};bk.onclick=cardSetup;
}

function gameOver(){
  const m=M,w=m.over,l=1-w,cpu=m.mode==="cpu";
  let starPart="",gs=0;
  if(cpu){const x=m.miss[0],s=x===0?3:x<=2?2:x<=4?1:0;
    const CI=LEVELS.findIndex(L=>L.type==="cards");if(s>P.stars[CI]){P.stars[CI]=s;save()}
    gs=s;starPart=`${starHTML(s)}<p class="sub">星星看配對失誤：0 次 3 顆、2 次內 2 顆、4 次內 1 顆</p>`}
  app.innerHTML=`<div class="result">

function lget(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}}
function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function sget(k){try{return sessionStorage.getItem(k)||""}catch(e){return ""}}
function sset(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
function sdel(k){try{sessionStorage.removeItem(k)}catch(e){}}
function esc(t){return String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c])}
const stripTags=t=>String(t??"").replace(/<[^>]+>/g,"");

const fmtTime=at=>{const d=new Date(at);return isNaN(d)?"":d.toLocaleString("zh-TW",{hour12:false,month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})};
const fmtDur=s=>{s=Math.round(+s||0);return s>=60?`${Math.floor(s/60)}分${s%60}秒`:`${s}秒`};

function logAns(q,p,pick,ok){if(G&&G.ans)G.ans.push({q:stripTags(q).slice(0,60),p,pick:stripTags(pick).slice(0,40),ok:!!ok})}
function isSus(item,a,thr){
  if(item==="R")return false;
  if((+a.dur||0)<thr)return true;
  const ps=(a.ans||[]).map(x=>x.p);
  return ps.length>=3&&ps.every(p=>p!=null&&p===ps[0])&&a.score<a.total;
}

function mergeRow(row,att){
  row.attempts=Array.isArray(row.attempts)?row.attempts:[];
  if(!row.attempts.some(a=>a.at===att.at))row.attempts.push(att);
  row.attempts.sort((a,b)=>a.at<b.at?-1:1);row.attempts=row.attempts.slice(-20);
  row.best=Math.max(+row.best||0,+att.stars||0);row.bestScore=Math.max(+row.bestScore||0,+att.score||0);
  row.total=+att.total||+row.total||0;row.updated=row.attempts[row.attempts.length-1].at;
}
function saveLocalRec(stu,item,att){
  const db=lget(LOCAL_DB,{}),k=stu.cls+"|"+stu.seat+"|"+item;
  const row=db[k]||{cls:stu.cls,seat:stu.seat,name:stu.name,item};row.name=stu.name;mergeRow(row,att);db[k]=row;lset(LOCAL_DB,db);
}
async function api(body){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  const j=await r.json();if(!j.ok)throw new Error(j.error||"error");return j;
}
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s)));
const makeCode=(stu,item,att)=>"DL1:"+b64e(JSON.stringify({s:stu,i:item,a:att}));

async function record(item,att){
  if(!STU)return {ok:false,msg:"尚未登記姓名，這次成績沒有記錄。"};
  att.at=new Date().toISOString();
  saveLocalRec(STU,item,att);
  if(!API)return {ok:true,msg:"本機模式：成績記在這台裝置（老師尚未設定成績表）。"};
  try{await api({action:"save",student:STU,item,attempt:att});return {ok:true,msg:"成績已上傳 ✓"}}
  catch(e){return {ok:false,msg:"連不上成績表。請按「複製成績碼」，把代碼交給老師：",code:makeCode(STU,item,att)}}
}
function recordAndShow(item,att){
  const el=document.getElementById("sync");if(el)el.textContent="成績上傳中…";
  record(item,att).then(r=>{
    const el=document.getElementById("sync");if(!el)return;
    el.textContent=r.msg;el.className="sub "+(r.ok?"sync-ok":"sync-bad");
    if(r.code){const box=document.createElement("div");box.className="codebox";

      const b=document.createElement("button");b.className="ghost";b.type="button";b.textContent="複製成績碼";b.onclick=()=>copyText(r.code,ta,b);
      box.append(ta,b);el.after(box)}
  });
}
function copyText(t,ta,btn){
  const fb=()=>{if(ta){ta.hidden=false;ta.focus();ta.select()}};
  try{navigator.clipboard.writeText(t).then(()=>{if(btn){const o=btn.textContent;btn.textContent="已複製 ✓";setTimeout(()=>btn.textContent=o,1500)}},fb)}catch(e){fb()}
}

/* --- 讀取成績 --- */
async function loadRows(cls){
  if(!API){
    const rows=Object.values(lget(LOCAL_DB,{}));
    return {teacher:true,local:true,classes:[...new Set(rows.map(r=>String(r.cls)))].sort(),rows:rows.filter(r=>!cls||String(r.cls)===String(cls))};
  }
  const pw=sget(TPW);
  const j=await api({action:"list",cls:cls||"",password:pw});
  if(pw&&!j.teacher)sdel(TPW);
  return {teacher:!!j.teacher,classes:(j.classes||[]).map(String).sort(),rows:j.rows||[]};
}
function people(rows,thr){
  const m={};
  rows.filter(r=>r.item!=="R").forEach(r=>{
    const k=r.cls+"|"+r.seat;
    const p=m[k]||(m[k]={cls:String(r.cls),seat:String(r.seat),name:String(r.name||""),stars:0,done:0,last:"",sus:0});
    p.name=String(r.name||p.name);p.stars+=+r.best||0;p.done++;
    const last=r.updated||"";if(last>p.last)p.last=last;
    (r.attempts||[]).forEach(a=>{if(isSus(r.item,a,thr))p.sus++});
  });
  return Object.values(m).sort((a,b)=>b.stars-a.stars||b.done-a.done||(+a.seat||0)-(+b.seat||0));
}
function attemptsOf(rows){
  const out=[];
  rows.forEach(r=>(r.attempts||[]).forEach(a=>out.push({...a,cls:String(r.cls),seat:String(r.seat),name:String(r.name||""),item:r.item})));
  return out.sort((a,b)=>a.at<b.at?1:-1);
}

    // analysis
    const lv=ITEMS.map(it=>{const rs=D.rows.filter(r=>r.item===it.id);const at=all.filter(a=>a.item===it.id);
      const sc=at.reduce((s,a)=>s+(+a.score||0),0),tt=at.reduce((s,a)=>s+(+a.total||0),0);
      return {it,people:rs.length,times:at.length,avg:rs.length?rs.reduce((s,r)=>s+(+r.best||0),0)/rs.length:0,rate:tt?sc/tt:null}});
    const qs={};all.filter(a=>a.item!=="R"&&a.item!=="L8").forEach(a=>(a.ans||[]).forEach(x=>{const k=a.item+"|"+x.q;(qs[k]=qs[k]||{item:a.item,q:x.q,n:0,ok:0});qs[k].n++;if(x.ok)qs[k].ok++}));
    const hard=Object.values(qs).filter(q=>q.n>=2).sort((a,b)=>a.ok/a.n-b.ok/b.n).slice(0,12);
    ana.innerHTML=`<div class="tbl"><table><thead><tr><th>關卡</th><th>作答人數</th><th>作答次數</th><th>平均最高星星</th><th>答對率</th></tr></thead><tbody>${
      lv.map(x=>`<tr><td>${esc(x.it.name)}</td><td>${x.people}</td><td>${x.times}</td><td>${x.avg.toFixed(1)}</td><td>${x.rate==null?"—":`<span class="bar-in"><i style="width:${Math.round(x.rate*100)}%"></i></span> ${Math.round(x.rate*100)}%`}</td></tr>`).join("")}</tbody></table></div>
      <h3 style="font-size:1.05rem;margin-top:6px">最常答錯的題目</h3>
      ${hard.length?`<div class="tbl"><table><thead><tr><th>關卡</th><th>題目</th><th>作答次數</th><th>答對率</th></tr></thead><tbody>${hard.map(q=>`<tr><td>${esc(ITEM_NAME(q.item))}</td><td>${esc(q.q)}</td><td>${q.n}</td><td>${Math.round(q.ok/q.n*100)}%</td></tr>`).join("")}</tbody></table></div>`:`<p class="empty">作答資料還不夠。</p>`}`;
    // reflections
    const rf=D.rows.filter(r=>r.item==="R").map(r=>{const a=(r.attempts||[]).slice(-1)[0]||{};return {seat:r.seat,name:r.name,at:a.at||r.updated,re:a.reflect||{}}})
      .sort((a,b)=>(+a.seat||0)-(+b.seat||0));
    refl.innerHTML=rf.length?`<div class="tbl"><table><thead><tr><th>座號</th><th>姓名</th><th>最有收穫的事</th><th>學會了</th><th>時間</th></tr></thead><tbody>${
      rf.map(x=>`<tr><td>${esc(x.seat)}</td><td>${esc(x.name)}</td><td class="say2">${esc(x.re.say||"")}</td><td class="ans">${esc((x.re.skills||[]).map(i=>SKILLS[i]).filter(Boolean).map(s=>s.split("：")[0].split("、")[0]).join("・"))}</td><td>${fmtTime(x.at)}</td></tr>`).join("")}</tbody></table></div>`
      :`<p class="empty">還沒有人交學習單。</p>`;
    // export
    exp.onclick=()=>{const head=["完成時間","班級","座號","姓名","項目","答對","題數","星星","用時(秒)","疑似亂答","作答內容"];
      const csv="﻿"+[head,...all.map(a=>[new Date(a.at).toLocaleString("zh-TW",{hour12:false}),a.cls,a.seat,a.name,ITEM_NAME(a.item),+a.score||0,+a.total||0,+a.stars||0,+a.dur||0,isSus(a.item,a,+lget(THR,30))?"是":"",ansText(a)])]
        .map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
      const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
      const l=document.createElement("a");l.href=url;l.download=`對聯闖關_${cls}班.csv`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)};
    // import codes
    impb.onclick=async()=>{const codes=(impc.value.match(/DL1:[A-Za-z0-9+/=]+/g)||[]);let n=0,bad=0;impm.textContent="匯入中…";
      for(const c of codes){try{const o=JSON.parse(b64d(c.slice(4)));if(!o.s||!o.i||!o.a)throw 0;
        if(API)await api({action:"save",student:o.s,item:o.i,attempt:o.a});else saveLocalRec(o.s,o.i,o.a);n++}catch(e){bad++}}
      impm.textContent=codes.length?`匯入 ${n} 筆${bad?`，${bad} 筆失敗`:""}。`:"找不到成績碼（要以 DL1: 開頭）。";impc.value="";if(n)load()};
    // clear
    clr1.onclick=()=>{clr.innerHTML=`<span class="sub">確定要清除 ${esc(cls)} 班所有成績和學習單？清除後無法復原。</span><button class="ghost" type="button" id="clr2">確定清除</button><button class="linkbtn" type="button" id="clr0">取消</button>`;
      clr0.onclick=()=>draw();
      clr2.onclick=async()=>{clr.innerHTML=`<span class="sub">清除中…</span>`;
        try{if(API)await api({action:"clearClass",cls,password:sget(TPW)});
          else{const db=lget(LOCAL_DB,{});Object.keys(db).forEach(k=>{if(String(db[k].cls)===String(cls))delete db[k]});lset(LOCAL_DB,db)}
          load()}catch(e){clr.innerHTML=`<span class="fb bad">清除失敗：密碼不正確或連不上成績表。</span>`}}};
  }
  load();
}
function ansText(a){
  if(a.item==="R"){const r=a.reflect||{};return (r.say||"")+((r.skills||[]).length?"（學會："+r.skills.map(i=>SKILLS[i]).filter(Boolean).map(s=>s.split("：")[0].split("、")[0]).join("・")+"）":"")}
  return (a.ans||[]).map((x,i)=>`${i+1}.${x.ok?"○":"×"}${x.pick}`).join(" ");
}

/* --- 大屏 #screen --- */
function screenView(){
  G=null;M=null;
  const cls=sget(SCLS)||(STU&&STU.cls)||"";
  app.innerHTML=`<div class="scr"><div class="scr-top"><h1>對聯闖關・<span id="scls2">${esc(cls)}</span> 班 即時戰況</h1>
    <div class="scr-btns"><span id="stime"></span><button type="button" id="sfs">全螢幕</button><a href="#scores">離開大屏</a></div></div>
    <div id="sbody"><p class="scr-msg">載入中…</p></div></div>`;
  sfs.onclick=()=>{try{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}};
  let quotes=[],qi=0;
  const showQuote=()=>{const el=document.getElementById("squote");if(!el)return;
    if(!quotes.length){el.textContent="交出學習單，你的一句話就會出現在這裡！";return}
    qi=(qi+1)%quotes.length;el.textContent=`「${quotes[qi].say}」—— ${quotes[qi].name}`};
  async function tick(){
    let D;
    try{D=await loadRows(cls)}catch(e){document.getElementById("stime").textContent="連線中斷，稍後自動重試";return}
    if(!document.getElementById("sbody"))return;
    if(!D.teacher){sbody.innerHTML=`<p class="scr-msg">大屏要老師登入後才能開啟。<br><a href="#scores">到成績頁登入 →</a></p>`;stopScreen();return}
    const ps=people(D.rows,0),all=attemptsOf(D.rows);
    const full=ps.filter(p=>p.done>=LEVELS.length).length;
    const avg=ps.length?(ps.reduce((s,p)=>s+p.stars,0)/ps.length).toFixed(1):"0";
    const lv=ITEMS.map(it=>{const at=all.filter(a=>a.item===it.id);const sc=at.reduce((s,a)=>s+(+a.score||0),0),tt=at.reduce((s,a)=>s+(+a.total||0),0);
      const rs=D.rows.filter(r=>r.item===it.id);const bs=rs.reduce((s,r)=>s+(+r.bestScore||0),0),bt=rs.reduce((s,r)=>s+(+r.total||0),0);
      return {it,rate:tt?sc/tt:(bt?bs/bt:null),n:rs.length}});
    quotes=D.rows.filter(r=>r.item==="R").map(r=>{const a=(r.attempts||[]).slice(-1)[0]||{};return {name:String(r.name||""),say:String((a.reflect||{}).say||"")}}).filter(q=>q.say);
    sbody.innerHTML=`<div class="scr-stats"><div><b>${ps.length}</b><span>已作答人數</span></div><div><b>${full}</b><span>完成八關</span></div><div><b>★ ${avg}</b><span>全班平均星星</span></div></div>
      <div class="scr-main"><section><h2>排行榜</h2><ol class="scr-rank">${ps.slice(0,5).map((p,i)=>`<li><span class="n">${i+1}</span><span class="nm">${esc(p.name)}</span><span class="s">★ ${p.stars}</span></li>`).join("")||'<li class="none">等待第一位上榜…</li>'}</ol></section>
      <section><h2>各關答對率</h2><div class="scr-bars">${lv.map(x=>`<div class="sb"><span class="lbl">${esc(x.it.name.replace(/^第(.)關 /,"$1 "))}</span><span class="track2"><i style="width:${x.rate==null?0:Math.round(x.rate*100)}%"></i></span><span class="pct">${x.rate==null?"—":Math.round(x.rate*100)+"%"}</span></div>`).join("")}</div></section></div>
      <p class="scr-quote" id="squote"></p>`;
    qi=-1;showQuote();
    document.getElementById("stime").textContent="更新於 "+new Date().toLocaleTimeString("zh-TW",{hour12:false});
  }
  tick();SCR_T=setInterval(tick,15000);SCR_Q=setInterval(showQuote,8000);
}

try{if(JSON.parse(localStorage.getItem("duilian-proj")))document.documentElement.classList.add("proj")}catch(e){}
route();window.addEventListener("hashchange",route);
